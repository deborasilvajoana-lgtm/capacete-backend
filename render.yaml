services:
  - type: web
    name: capacete-backend-pro
    env: node
    plan: free
    buildCommand: npm ci || npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: MQTT_HOST
        sync: false
      - key: MQTT_PORT
        value: "8883"
      - key: MQTT_USER
        sync: false
      - key: MQTT_PASS
        sync: false
      - key: MQTT_TOPICS
        value: capacete/status,capacete/+/status
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: DEFAULT_DEVICE_ID
        value: default
      - key: DEFAULT_FUNCIONARIO
        value: Débora da Silva Costa
      - key: DEFAULT_EPI
        value: Capacete 01
      - key: OFFLINE_GAP_SECONDS
        value: "120"
      - key: ENABLE_LEGACY_MIRROR
        value: "true"
      - key: ENABLE_TEST_ENDPOINTS
        value: "false"

      - key: MARY_AI_ENABLED
        value: "true"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: OPENROUTER_SITE_URL
        sync: false

      # E-mail de solicitações via API HTTPS no Render Free
      - key: APPROVAL_ADMIN_EMAIL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
